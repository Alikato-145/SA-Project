name: Verify payroll
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - run: bun x playwright install --with-deps chromium webkit
        working-directory: frontend
      - run: sh scripts/verify.sh
      - name: WebKit payroll and mobile journeys
        run: bun run test:e2e --browser=webkit --output=test-results-webkit --grep 'fresh organization|mobile keyboard|organization duplicate'
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:18083
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: |
            frontend/playwright-report
            frontend/test-results
            frontend/playwright-report-webkit
            frontend/test-results-webkit
            docs/superpowers/reports/full-uat-evidence
          retention-days: 7
      - run: docker build -f frontend/Dockerfile frontend
      - run: docker build -f backend/Dockerfile backend
      - name: Container diagnostics
        if: failure()
        run: docker compose --env-file .env.example -p haris-payroll-verify -f compose.yaml -f compose.verify.yaml logs --tail 100
      - name: Stop disposable stack
        if: always()
        run: docker compose --env-file .env.example -p haris-payroll-verify -f compose.yaml -f compose.verify.yaml down -v
